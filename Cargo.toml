[package]
name = "arc-automation"
version = "0.14.1"
edition = "2024"
description = "A scriptable automation tool."
authors = ["myFavShrimp <myfavshrimp@tuta.io>"]
repository = "https://github.com/myFavShrimp/arc"
license = "MIT"
publish = true
categories = [
    "command-line-utilities",
    "config",
    "development-tools"
]
keywords = ["orchestration", "ssh", "lua", "infrastructure", "scripting"]

[[bin]]
name = "arc"
path = "src/main.rs"

[profile.release]
lto = "fat"
strip = "symbols"

[dependencies]
mlua = { version = "0.12", features = ["luajit", "vendored", "macros", "serialize"] }
clap = { version = "4.6", features = ["derive"] }
ssh2 = "0.9"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tera = "2.4.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
colored = "3.1.1"
dotenvy = "0.15.7"
indexmap = "2.14.2"
strum = { version = "0.28.0", features = ["derive"] }
tabled = "0.22.0"
indicatif = "0.18"
toml = "1.1.8"
serde_yaml = "0.9.34"
serde_qs = "1.1.3"
